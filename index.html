<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>
    <h1 class="game-title">ROCK PAPER SCISSORS</h1>
    <div class="scoreboard">
        <div class="score player-score">
            <div class="label">Player</div>
            <div class="points" id="player-points">0</div>
        </div>
        <div class="score computer-score">
            <div class="label">Computer</div>
            <div class="points" id="computer-points">0</div>
        </div>
    </div>
    <button id="reset">RESET</button>
    <div class="container">
        <button id="rock">ROCK</button>
        <button id="paper">PAPER</button>
        <button id="scissors">SCISSORS</button>
    </div>
    <div class="results"></div>
</body>

</html>
